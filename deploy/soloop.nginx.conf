server {
    listen 80;
    server_name __SOLOOP_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/soloop-acme;
    }
    location / {
        return 301 https://__SOLOOP_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __SOLOOP_HOST__;

    ssl_certificate /etc/letsencrypt/live/__SOLOOP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SOLOOP_HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
